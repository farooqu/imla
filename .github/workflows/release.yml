# Each vX.Y.Z tag becomes a GitHub release: this builds, signs, and publishes
# Imla.dmg, plus Imla.zip and the Sparkle appcast.xml for updates, with the tag's message as the notes.
# scripts/release.sh creates the tags.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@v7

      - name: Version
        id: version
        run: |
          # Fetched again: checking out a tag can leave it lightweight, without its message.
          # Every tag's message goes into the update window's notes.
          git fetch --force --tags origin
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$RUNNER_TEMP/imla-signing.keychain-db" >> "$GITHUB_ENV"

      - name: Check secrets
        env:
          P12: ${{ secrets.IMLA_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IMLA_SIGNING_P12_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=0
          for name in P12 P12_PASSWORD SPARKLE_KEY; do
            [ -n "${!name}" ] || { echo "::error::Secret for $name is not set"; missing=1; }
          done
          exit $missing

      - name: Cache runtime
        uses: actions/cache@v5
        with:
          path: .runtime/lib
          key: runtime-${{ runner.os }}-${{ hashFiles('scripts/build-runtime.sh', 'Sources/CLlama/include/**') }}

      - name: Build runtime
        run: ./scripts/build-runtime.sh

      - name: Test
        run: ./scripts/test.sh

      - name: Import signing certificate
        env:
          P12: ${{ secrets.IMLA_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IMLA_SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/imla.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/imla.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/imla.p12"
          security find-identity -p codesigning "$KEYCHAIN" | grep -q '"Imla Release"'

      - name: Build app
        env:
          IMLA_SIGN_IDENTITY: Imla Release
          IMLA_VERSION: ${{ steps.version.outputs.version }}
          IMLA_BUILD: ${{ steps.version.outputs.build }}
          IMLA_INSTALL_DIR: none
        run: ./scripts/build-app.sh

      - name: Disk image
        run: |
          # For first installs: Imla next to an Applications shortcut to drag it onto.
          # Updates use the zip. Left unsigned: Gatekeeper checks a signed disk image when
          # it's opened and blocks one that isn't notarized, which would add a second
          # warning before the one for the app.
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE" dist
          ditto build/Imla.app "$STAGE/Imla.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Imla -srcfolder "$STAGE" -fs HFS+ -format UDZO -ov dist/Imla.dmg

      - name: Package and sign update
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Imla.app dist/Imla.zip
          KEY_FILE="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_KEY" > "$KEY_FILE"
          SIGNATURE="$(.build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file "$KEY_FILE" dist/Imla.zip)"
          rm "$KEY_FILE"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases"
          # Shown in Sparkle's update window, instead of loading the GitHub release page:
          # the notes of every release newer than the one installed.
          NOTES_HTML="$(python3 scripts/notes-html.py)"
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Imla</title>
              <item>
                <title>Imla $VERSION</title>
                <pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <description><![CDATA[$NOTES_HTML]]></description>
                <sparkle:fullReleaseNotesLink>$BASE</sparkle:fullReleaseNotesLink>
                <enclosure url="$BASE/download/v$VERSION/Imla.zip" type="application/octet-stream" $SIGNATURE/>
              </item>
            </channel>
          </rss>
          EOF
          cat dist/appcast.xml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/Imla.dmg dist/Imla.zip dist/appcast.xml \
            --verify-tag --title "Imla $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true
